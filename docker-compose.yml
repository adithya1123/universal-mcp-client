services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: mcp-postgres
    environment:
      POSTGRES_DB: mcp_chat
      POSTGRES_USER: mcp_user
      POSTGRES_PASSWORD: mcp_pass
    command: >
      postgres
      -c shared_preload_libraries=''
      -c log_min_messages=WARNING
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp_user -d mcp_chat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mcp-network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PORT=${BACKEND_PORT:-9000}
    container_name: mcp-backend
    environment:
      - PORT=${BACKEND_PORT:-9000}
      - DATABASE_URL=postgresql+asyncpg://mcp_user:mcp_pass@postgres:${POSTGRES_PORT:-5432}/mcp_chat
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION}
      - ALLOWED_ORIGINS=http://localhost:${FRONTEND_PORT:-5173},http://frontend:8080
      - REQUIRE_TOOL_APPROVAL=${REQUIRE_TOOL_APPROVAL:-false}
      - DEBUG=false
      - LOG_LEVEL=INFO
    ports:
      - "${BACKEND_PORT:-9000}:${BACKEND_PORT:-9000}"
    volumes:
      - ./config:/app/config
      - /tmp:/tmp  # For MCP filesystem server access
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:$${PORT:-9000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mcp-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mcp-frontend
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-9000}
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - mcp-network
    restart: unless-stopped

networks:
  mcp-network:
    driver: bridge

volumes:
  postgres_data:
